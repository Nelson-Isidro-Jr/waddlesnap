<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'">
  <title>WaddleSnap</title>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="penguin.css">
  <style>
    :root { --pink: #FF5E9C; --pink-d: #E8457F; --head: #4A2338; --muted: #9E7389; --spring: cubic-bezier(.34, 1.56, .64, 1); }
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; font-family: 'Nunito', 'Segoe UI', sans-serif; }
    .toast {
      position: absolute; right: 10px; bottom: 10px; left: 10px; height: 104px; display: flex; align-items: center; gap: 12px;
      padding: 10px 16px 10px 10px; border-radius: 24px; cursor: pointer;
      background: linear-gradient(135deg, #FFFFFF 0%, #FFF1F7 100%); border: 1.5px solid #FFD6E6;
      box-shadow: 0 10px 28px -10px rgba(120, 20, 70, .45);
      transform: translateX(120%) rotate(4deg); opacity: 0;
    }
    .toast.show { animation: tin .6s var(--spring) forwards; }
    .toast.hide { animation: tout .38s ease-in forwards; }
    @keyframes tin { from { transform: translateX(110%) rotate(5deg); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes tout { from { transform: none; opacity: 1; } to { transform: translateX(110%) rotate(4deg); opacity: 0; } }
    .toast:hover { border-color: #FFB0CF; }
    .peng-wrap { width: 74px; height: 82px; flex: none; margin-top: -6px; }
    .peng-wrap .peng { width: 100%; height: 100%; }
    .thumb { width: 84px; height: 62px; border-radius: 12px; flex: none; object-fit: cover; border: 2px solid #fff; box-shadow: 0 6px 14px -6px rgba(120, 20, 70, .5); transform: rotate(-4deg); background: #FFF0F6; }
    .toast.show .thumb { animation: thumbIn .7s var(--spring) .15s both; }
    @keyframes thumbIn { from { transform: rotate(-20deg) scale(.4); opacity: 0; } to { transform: rotate(-4deg); opacity: 1; } }
    .txt { min-width: 0; flex: 1; }
    .title { font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 17px; color: var(--head); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .text { font-size: 12.5px; line-height: 1.35; color: var(--muted); font-weight: 700; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .count { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 40px; color: var(--pink); line-height: 1; flex: none; }
    .toast.show .count { animation: cnt .6s var(--spring) .1s both; }
    @keyframes cnt { from { transform: scale(.3) rotate(-20deg); opacity: 0; } }
    .toast.warn { background: linear-gradient(135deg, #FFFFFF 0%, #FFF4EC 100%); border-color: #FFD9BE; }
    .hearts { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
    .heart { position: absolute; width: 14px; height: 14px; color: var(--pink); animation: float 1.1s ease-out forwards; }
    .heart svg { width: 100%; height: 100%; fill: currentColor; }
    @keyframes float { 0% { transform: translate(0, 0) scale(.3); opacity: 0; } 20% { opacity: 1; } 100% { transform: translate(var(--dx), -60px) scale(1) rotate(var(--r)); opacity: 0; } }
  </style>
</head>
<body>
  <div class="toast" id="toast">
    <div class="peng-wrap" id="peng"></div>
    <img class="thumb" id="thumb" alt="" hidden>
    <div class="txt"><div class="title" id="title"></div><div class="text" id="text"></div></div>
    <div class="count" id="count" hidden></div>
    <div class="hearts" id="hearts"></div>
  </div>
  <script src="penguin.js"></script>
  <script src="sounds.js"></script>
  <script src="toast.js"></script>
</body>
</html>
